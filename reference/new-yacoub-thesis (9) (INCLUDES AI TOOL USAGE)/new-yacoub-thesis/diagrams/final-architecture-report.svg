<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1000" viewBox="0 0 2200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Report-level workflow-to-action architecture</title>
  <desc id="desc">Clean architecture diagram showing temperature input, PC-hosted Docker n8n workflow decisions, JSON contract and validation boundary, Python middleware API, simulated fan action, CSV metrics, and Raspberry Pi middleware validation.</desc>
  <defs>
    <style>
      .zone { fill: #f8fafc; stroke: #334155; stroke-width: 2.4; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2.1; }
      .blue { fill: #eaf3ff; stroke: #2563eb; }
      .orange { fill: #fff7e6; stroke: #b26b00; }
      .green { fill: #eef8e8; stroke: #4d7c0f; }
      .cyan { fill: #eef7ff; stroke: #1f77b4; }
      .zone-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 19px; fill: #111827; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; fill: #334155; }
      .note { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-style: italic; fill: #334155; }
      .icon { stroke: #334155; stroke-width: 2.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="2200" height="1000" fill="#ffffff"/>

  <!-- Zones -->
  <rect class="zone" x="40" y="85" width="270" height="260" rx="18"/>
  <text class="zone-title" x="68" y="127">Input / event</text>

  <rect class="zone" x="360" y="65" width="660" height="485" rx="18"/>
  <text class="zone-title" x="388" y="108">PC-hosted workflow runtime</text>

  <rect class="zone" x="1075" y="125" width="330" height="245" rx="18"/>
  <text class="zone-title" x="1103" y="168">Contract / validation</text>

  <rect class="zone" x="1460" y="85" width="370" height="340" rx="18"/>
  <text class="zone-title" x="1488" y="127">Middleware endpoint</text>

  <rect class="zone" x="1880" y="125" width="280" height="245" rx="18"/>
  <text class="zone-title" x="1908" y="168">Evaluation artifacts</text>

  <rect class="zone" x="480" y="650" width="900" height="220" rx="18"/>
  <text class="zone-title" x="508" y="692">Raspberry Pi middleware validation</text>

  <!-- Zone icon badges -->
  <g transform="translate(248 116)">
    <line class="icon" x1="16" y1="0" x2="16" y2="42"/>
    <circle class="icon" cx="16" cy="54" r="13"/>
    <line class="icon" x1="16" y1="12" x2="33" y2="12"/>
    <line class="icon" x1="16" y1="26" x2="29" y2="26"/>
  </g>
  <g transform="translate(942 88)">
    <rect class="icon" x="0" y="0" width="52" height="34" rx="4"/>
    <line class="icon" x1="18" y1="45" x2="35" y2="45"/>
    <line class="icon" x1="26" y1="35" x2="26" y2="45"/>
  </g>
  <g transform="translate(1334 150)">
    <path class="icon" d="M0 0 H35 L48 13 V62 H0 Z"/>
    <path class="icon" d="M35 0 V13 H48"/>
    <path class="icon" d="M13 37 L23 48 L40 25"/>
  </g>
  <g transform="translate(1760 112)">
    <rect class="icon" x="0" y="0" width="50" height="14" rx="3"/>
    <rect class="icon" x="0" y="20" width="50" height="14" rx="3"/>
    <rect class="icon" x="0" y="40" width="50" height="14" rx="3"/>
    <circle cx="40" cy="7" r="2.5" fill="#334155"/>
    <circle cx="40" cy="27" r="2.5" fill="#334155"/>
    <circle cx="40" cy="47" r="2.5" fill="#334155"/>
  </g>
  <g transform="translate(2110 150)">
    <path class="icon" d="M0 0 H42 L56 14 V64 H0 Z"/>
    <path class="icon" d="M42 0 V14 H56"/>
    <line class="icon" x1="12" y1="30" x2="45" y2="30"/>
    <line class="icon" x1="12" y1="44" x2="45" y2="44"/>
    <line class="icon" x1="28" y1="20" x2="28" y2="56"/>
  </g>
  <g transform="translate(1300 680)">
    <rect class="icon" x="0" y="0" width="62" height="44" rx="6"/>
    <circle cx="12" cy="12" r="3" fill="#334155"/>
    <circle cx="50" cy="12" r="3" fill="#334155"/>
    <circle cx="12" cy="32" r="3" fill="#334155"/>
    <circle cx="50" cy="32" r="3" fill="#334155"/>
    <path class="icon" d="M18 22 H44 M31 10 V34"/>
  </g>

  <!-- Main components -->
  <rect class="box" x="76" y="190" width="200" height="105" rx="14"/>
  <text class="label" x="176" y="227" text-anchor="middle">
    <tspan x="176" dy="0">Temperature event</tspan>
    <tspan x="176" dy="24">/ test input</tspan>
  </text>

  <rect class="box blue" x="410" y="170" width="220" height="88" rx="14"/>
  <text class="label" x="520" y="205" text-anchor="middle">
    <tspan x="520" dy="0">PC-hosted</tspan>
    <tspan x="520" dy="24">Docker n8n</tspan>
  </text>

  <path class="box" d="M 620 375 L 715 320 L 810 375 L 715 430 Z"/>
  <text class="label" x="715" y="371" text-anchor="middle">
    <tspan x="715" dy="0">Workflow</tspan>
    <tspan x="715" dy="24">decision</tspan>
  </text>

  <rect class="box" x="810" y="195" width="180" height="86" rx="14"/>
  <text class="label" x="900" y="226" text-anchor="middle">
    <tspan x="900" dy="0">Deterministic</tspan>
    <tspan x="900" dy="24">baseline</tspan>
  </text>

  <rect class="box" x="810" y="420" width="180" height="92" rx="14"/>
  <text class="label" x="900" y="452" text-anchor="middle">
    <tspan x="900" dy="0">Minimal agent-</tspan>
    <tspan x="900" dy="24">enhanced</tspan>
    <tspan x="900" dy="24">workflow</tspan>
  </text>

  <rect class="box orange" x="1115" y="220" width="250" height="110" rx="14"/>
  <text class="label" x="1240" y="256" text-anchor="middle">
    <tspan x="1240" dy="0">JSON contract</tspan>
    <tspan x="1240" dy="24">+ validation boundary</tspan>
  </text>

  <rect class="box cyan" x="1505" y="175" width="285" height="90" rx="14"/>
  <text class="label" x="1648" y="213" text-anchor="middle">
    <tspan x="1648" dy="0">Python middleware API</tspan>
  </text>

  <rect class="box cyan" x="1505" y="315" width="285" height="90" rx="14"/>
  <text class="label" x="1667" y="350" text-anchor="middle">
    <tspan x="1667" dy="0">/fan/on or /fan/off</tspan>
    <tspan x="1667" dy="24">simulated fan action</tspan>
  </text>

  <rect class="box green" x="1920" y="218" width="220" height="105" rx="14"/>
  <text class="label" x="2030" y="256" text-anchor="middle">
    <tspan x="2030" dy="0">CSV results</tspan>
    <tspan x="2030" dy="24">and metrics</tspan>
  </text>

  <rect class="box blue" x="570" y="745" width="310" height="94" rx="14"/>
  <text class="label" x="725" y="777" text-anchor="middle">
    <tspan x="725" dy="0">Raspberry Pi</tspan>
    <tspan x="725" dy="24">middleware/action endpoint</tspan>
  </text>

  <rect class="box green" x="990" y="745" width="300" height="94" rx="14"/>
  <text class="label" x="1140" y="777" text-anchor="middle">
    <tspan x="1140" dy="0">Validation evidence</tspan>
    <tspan x="1140" dy="24">HTTP call and metrics</tspan>
  </text>

  <!-- Arrows -->
  <path class="arrow" d="M 276 242 L 410 214"/>
  <path class="arrow" d="M 520 258 L 520 375 L 620 375"/>
  <path class="arrow" d="M 790 363 L 810 238"/>
  <path class="arrow" d="M 790 387 L 810 466"/>
  <path class="arrow" d="M 990 238 L 1115 254"/>
  <path class="arrow" d="M 990 466 L 1115 304"/>
  <path class="arrow" d="M 1365 275 L 1505 220"/>
  <path class="arrow" d="M 1648 265 L 1648 315"/>
  <path class="arrow" d="M 1790 220 L 1920 270"/>

  <path class="arrow dashed" d="M 520 258 L 520 630 L 725 630 L 725 745"/>
  <text class="small" x="595" y="612">HTTP over network</text>
  <path class="arrow" d="M 880 792 L 990 792"/>
  <path class="arrow dashed" d="M 1290 792 L 1670 792 L 1670 560 L 2030 560 L 2030 323"/>
  <text class="small" x="1815" y="538">validation evidence</text>

  <!-- Note -->
  <rect x="500" y="920" width="1200" height="60" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="note" x="1100" y="957" text-anchor="middle">Note: fan action is simulated; Raspberry Pi validation runs the middleware/action endpoint, not n8n.</text>
</svg>
